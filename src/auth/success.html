<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed In - unslopmyfeed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 400px;
            padding: 48px 32px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: -0.5px;
        }

        .logo-text .highlight {
            color: #3b82f6;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
        }

        .icon-circle svg {
            width: 32px;
            height: 32px;
            color: #3b82f6;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #71717a;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto 32px;
        }

        .hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 13px;
            color: #a1a1aa;
        }

        .hint svg {
            width: 16px;
            height: 16px;
            color: #3b82f6;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo-text">unslop<span class="highlight">myfeed</span></span>

        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <h1>You're all set!</h1>
        <p class="subtitle">Signed in successfully. Your filters are synced and ready to clean your timeline.</p>

        <div class="hint">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
            Click the extension icon to start filtering
        </div>
    </div>
</body>
</html>
