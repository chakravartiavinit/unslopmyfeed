<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out - unslopmyfeed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 400px;
            padding: 48px 32px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: -0.5px;
        }

        .logo-text .highlight {
            color: #3b82f6;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid rgba(34, 197, 94, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto 24px;
        }

        .icon-circle svg {
            width: 32px;
            height: 32px;
            color: #22c55e;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #71717a;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto 32px;
        }

        .signin-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .signin-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo-text">unslop<span class="highlight">myfeed</span></span>

        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <h1>You've been signed out</h1>
        <p class="subtitle">Your settings are safe in the cloud. Sign back in anytime to continue filtering.</p>

        <a href="auth.html" class="signin-btn">Sign Back In</a>
    </div>

    <!-- Load Supabase to clear the session -->
    <script src="supabase-bundle.js"></script>
    <script src="signout.js"></script>
</body>
</html>
